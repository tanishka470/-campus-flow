<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campus In-Out System</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="site-header-inner">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">CF</div>
          <div>
            <p class="brand-title">Campus In-Out System</p>
            <p class="brand-sub">Hostel &amp; main gate access</p>
          </div>
        </div>
        <nav class="nav-tabs" aria-label="Sections">
          <button type="button" class="nav-tab active" data-tab="simulator">Gate terminal</button>
          <button type="button" class="nav-tab" data-tab="admin">Admin office</button>
        </nav>
      </div>
    </header>

    <main class="main-content">
      <div id="panel-simulator"></div>
      <div id="panel-admin" hidden></div>
    </main>

    <footer class="site-footer">
      <span>Pre-project MVP · Card reader integration</span>
    </footer>
    <script src="/app.js"></script>
  </body>
</html>
